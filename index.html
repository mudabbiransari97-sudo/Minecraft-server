<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Server - Login</title>
  <link rel="shortcut icon" href="2(1).png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }
    
    /* Video Background */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      object-fit: cover;
      border: none;
    }
    
    /* Dark Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(0,0,0,0.65), rgba(10,15,30,0.75));
      z-index: 0;
      backdrop-filter: blur(2px);
    }
    
    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .form-card {
      background: linear-gradient(135deg, rgba(30,45,70,0.95), rgba(20,30,50,0.95));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: slideUp 0.6s ease-out;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .form-header {
      text-align: center;
      margin-bottom: 28px;
    }
    
    .form-header h1 {
      color: #fff;
      font-size: 28px;
      margin-bottom: 8px;
      font-weight: 700;
    }
    
    .form-header p {
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      font-weight: 500;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      color: rgba(255,255,255,0.8);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: rgba(255,255,255,0.4);
    }
    
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      background: rgba(255,255,255,0.1);
      border-color: rgba(0,184,148,0.5);
      box-shadow: 0 0 12px rgba(0,184,148,0.15);
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }
    
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .btn-submit {
      background: linear-gradient(135deg, #00b894, #00a080);
      color: #000;
      box-shadow: 0 8px 20px rgba(0,184,148,0.3);
    }
    
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0,184,148,0.4);
    }
    
    .btn-submit:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .btn-register {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.8);
      border: 1px solid rgba(255,255,255,0.1);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    
    .btn-register:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
    
    .footer-text {
      text-align: center;
      margin-top: 16px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
    }
    
    .footer-text a {
      color: #00b894;
      text-decoration: none;
      font-weight: 600;
    }
    
    .footer-text a:hover {
      text-decoration: underline;
    }
    
    @media (max-width: 640px) {
      .form-card {
        padding: 24px;
      }
      
      .form-header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <!-- YouTube Video Background -->
  <iframe class="video-background" 
    src="https://www.youtube.com/embed/1DhWXAiNgfQ?autoplay=1&mute=1&controls=0&loop=1&playlist=1DhWXAiNgfQ&modestbranding=1" 
    title="Minecraft" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
    allowfullscreen>
  </iframe>
  
  <!-- Dark Overlay -->
  <div class="overlay"></div>
  
  <!-- Main Container -->
  <div class="container">
    <div class="form-card">
      <div class="form-header">
        <h1>⛏️ Sign In</h1>
        <p>Login with your account. If you are new, use the register button to create one.</p>
      </div>
      
      <form id="loginForm" action="/login" method="POST">
        <div class="form-group">
          <label for="name">Username or Email</label>
          <input type="text" id="name" name="name" placeholder="Enter username or email" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-submit" id="signInBtn" disabled>Sign In</button>
          <button class="btn btn-submit" type="reset" id="clearBtn">Clear</button>
        </div>
        
        <div class="footer-text">
          New here? <a href="register.html">Register now</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const signInBtn = document.getElementById('signInBtn');
    const nameInput = document.getElementById('name');
    const passwordInput = document.getElementById('password');

    function toggleSignInButton() {
      const hasName = nameInput.value.trim() !== '';
      const hasPassword = passwordInput.value.trim() !== '';
      signInBtn.disabled = !(hasName && hasPassword);
    }

    nameInput.addEventListener('input', toggleSignInButton);
    passwordInput.addEventListener('input', toggleSignInButton);

    loginForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      const name = nameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!name || !password) {
        return;
      }

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identity: name, password })
        });

        let data = {};
        try {
          data = await response.json();
        } catch (jsonError) {
          data = {};
        }

        if (!response.ok) {
          throw new Error(data.message || 'Invalid username/email or password.');
        }

        localStorage.setItem('minecraftToken', data.token);
        localStorage.setItem('minecraftLoggedIn', 'true');
        localStorage.setItem('minecraftUser', data.user.username);
        localStorage.setItem('minecraftUserId', String(data.user.id));
        window.location.href = 'Menu.html';
      } catch (error) {
        let message = document.getElementById('loginMessage');
        if (!message) {
          message = document.createElement('p');
          message.id = 'loginMessage';
          message.style.cssText = 'margin-top:14px;color:#fda4af;text-align:center;font-size:13px;';
          loginForm.appendChild(message);
        }

        const isNetworkError = error instanceof TypeError && /fetch|Failed to fetch/i.test(error.message);
        message.textContent = isNetworkError
          ? 'Server is not responding. Please start the app or try again later.'
          : error.message;
      }
    });

    toggleSignInButton();
  </script>

</body>
</html>
